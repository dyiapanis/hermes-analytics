# Model Aliases — maps local deployment model names to canonical IDs
# for indicative cost lookup via OpenRouter and Hugging Face Router APIs.
#
# OpenRouter is the preferred source (has cache_read pricing for most models).
# HF Router is the fallback (input/output only, no cache pricing).
#
# The plugin tries core's agent.usage_pricing first for recognized providers,
# then OpenRouter (via this alias map), then HF Router, then returns unknown.
#
# To refresh: fetch https://openrouter.ai/api/v1/models and
# https://router.huggingface.co/v1/models, update IDs as needed.
# Last refreshed: 2026-08-07

