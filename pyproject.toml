[project]
name = "hermes-analytics"
version = "2.1.0"
description = "SQLite analytics plugin for Hermes Agent — LLM calls, tool usage, cost tracking, context pressure, and fleet reporting"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "dyiapanis"}]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/dyiapanis/hermes-analytics"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"